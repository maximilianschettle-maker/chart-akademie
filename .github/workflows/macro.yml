name: Makro-Daten (Fed & EZB)

# Holt Zinsen, Termine und Statements von Fed und EZB nach public/data/macro.json,
# verschickt fällige Web-Push-Nachrichten und committet nur bei Änderungen.
# Zeiten in Cron sind UTC. Das 10-Minuten-Raster deckt Sommer- wie Winterzeit ab:
#   EZB 14:15 Frankfurt = 12:15/13:15 UTC · Fed 14:00 New York = 18:00/19:00 UTC,
# plus Vortag-Erinnerung (Di/Mi) und bis drei Stunden Nachlauf, bis das Ergebnis im Feed ist.
# Das Skript lauf-noetig.ts beendet Raster-Läufe sofort, wenn kein Termin nah ist.
# GitHub-Cron kann 5–30 Minuten verspätet sein – die Push-Fenster sind entsprechend breit.

on:
  schedule:
    - cron: '0 6 * * *' # täglich 06:00 UTC
    - cron: '*/10 11-22 * * 2-4' # Di–Do alle 10 Minuten, 11:00–22:50 UTC (Entscheidungsfenster)
  workflow_dispatch:
    inputs:
      aktion:
        description: 'Was tun?'
        type: choice
        default: daten
        options:
          - daten
          - test-push
      nachricht:
        description: 'Text der Testnachricht (nur bei test-push)'
        type: string
        default: 'Testnachricht aus der GitHub Action'

permissions:
  contents: write
  actions: write

# Dieselbe Gruppe wie tracker.yml: beide committen data/push-status.json
concurrency:
  group: daten-action
  cancel-in-progress: false

env:
  RASTER_CRON: '*/10 11-22 * * 2-4'

jobs:
  makro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lauf nötig?
        id: pruefen
        env:
          ANLASS: ${{ github.event.schedule || github.event_name }}
        run: node scripts/macro/lauf-noetig.ts

      - uses: actions/setup-node@v4
        if: steps.pruefen.outputs.noetig == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten
        if: steps.pruefen.outputs.noetig == 'true'
        run: npm ci --ignore-scripts

      - name: Daten holen
        id: daten
        if: steps.pruefen.outputs.noetig == 'true' && inputs.aktion != 'test-push'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: node scripts/macro/hole-macro.ts

      - name: Push verschicken
        if: steps.pruefen.outputs.noetig == 'true'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#/makro
          NACHRICHT: ${{ inputs.nachricht }}
        run: |
          if [ "${{ inputs.aktion }}" = "test-push" ]; then
            node scripts/macro/sende-push.ts --test "$NACHRICHT"
          else
            node scripts/macro/sende-push.ts
          fi

      - name: Committen, wenn sich etwas geändert hat
        id: commit
        if: steps.pruefen.outputs.noetig == 'true'
        run: |
          git add public/data
          [ -f data/push-status.json ] && git add data/push-status.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^public/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Makro-Daten: Stand $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Falls zwischenzeitlich gepusht wurde: nachziehen und erneut versuchen
          for i in 1 2 3; do
            git push && break
            git pull --rebase && sleep 5
          done

      - name: Pages-Deploy anstoßen
        # Ein Push mit GITHUB_TOKEN löst deploy.yml nicht aus → per workflow_dispatch starten
        if: steps.commit.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
