name: Markt-Tracker

# Holt Tageskerzen der konfigurierten Instrumente (S&P 500, Nasdaq, Gold, Bitcoin …),
# erkennt Muster (Breakout, Tunnel, EMA-Kreuz, RSI, Lehrbuch-Setups) und verschickt
# Push-Nachrichten bei neuen Signalen. Konfiguration ist die Vereinigung aller Nutzer aus dem
# Worker (App → Tracker → Einstellungen je Einladungscode), sonst data/tracker-config.json.
# Werktags alle 15 Minuten (Börsen- und Krypto-Zeiten), am Wochenende alle zwei Stunden (Krypto).
# Im selben Lauf werden die Preiszonen der Nutzer geprüft (scripts/tracker/zonen-alarm.ts, Zustand im Worker).
# Außerhalb der Tracker-Zeiten startet der Worker-Cron den Lauf mit nur=zonen: dann nur die Zonen der Märkte,
# die rund um die Uhr handeln (Bitcoin), ohne Tracker, ohne Commit.
# Committet wird nur bei neuen Signalen/Kerzen oder deutlicher Kursbewegung; Live-Kurse holt
# die App selbst über den Worker, deshalb muss nicht jeder Lauf deployen.

on:
  schedule:
    # Nicht zur vollen Viertelstunde: dann ist GitHubs Scheduler am vollsten und lässt Läufe aus
    - cron: '4,19,34,49 7-22 * * 1-5' # Mo–Fr alle 15 Minuten, 07:04–22:49 UTC
    - cron: '4 */2 * * 0,6' # Sa/So alle zwei Stunden
  workflow_dispatch:
    inputs:
      nur:
        description: 'zonen = nur die Preiszonen prüfen (Lauf außerhalb der Tracker-Zeiten)'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

# Dieselbe Gruppe wie macro.yml: beide committen data/push-status.json
concurrency:
  group: daten-action
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Kurse holen und analysieren
        if: inputs.nur != 'zonen'
        id: daten
        env:
          AKTIEN_WORKER_URL: ${{ secrets.AKTIEN_WORKER_URL }}
          AKTIEN_SECRET: ${{ secrets.AKTIEN_SECRET }}
        run: npx tsx scripts/tracker/hole-tracker.ts

      # läuft auch, wenn der Tracker-Schritt wegen einer Kursquelle rot ist
      - name: Preiszonen prüfen und Alarme verschicken
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          AKTIEN_WORKER_URL: ${{ secrets.AKTIEN_WORKER_URL }}
          AKTIEN_SECRET: ${{ secrets.AKTIEN_SECRET }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          ZONEN_LAUF: ${{ inputs.nur == 'zonen' && 'nur' || '' }}
        run: npx tsx scripts/tracker/zonen-alarm.ts

      - name: Push verschicken
        if: inputs.nur != 'zonen'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          AKTIEN_WORKER_URL: ${{ secrets.AKTIEN_WORKER_URL }}
          AKTIEN_SECRET: ${{ secrets.AKTIEN_SECRET }}
          # Übergang: altes Einzel-Abo; nach dem Umzug der Geräte in die App löschen
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#/makro
        run: node scripts/macro/sende-push.ts

      - name: Committen, wenn sich etwas geändert hat
        if: inputs.nur != 'zonen'
        id: commit
        run: |
          git add public/data
          [ -f data/push-status.json ] && git add data/push-status.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^public/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Tracker-Daten: Stand $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && break
            git pull --rebase && sleep 5
          done

      - name: Pages-Deploy anstoßen
        if: inputs.nur != 'zonen' && steps.commit.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
