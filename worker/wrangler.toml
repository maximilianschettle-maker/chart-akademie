# Cloudflare Worker: Proxy + Cache für den Aktien-Bereich (SEC EDGAR + Yahoo Finance).
# Deploy: npm run worker:deploy  ·  lokal: npm run worker:dev (Port 8787)
# Secrets (nie hier eintragen): AKTIEN_SECRET, SEC_USER_AGENT → `npx wrangler secret put NAME --config worker/wrangler.toml`
# Lokal liegen die Secrets in worker/.dev.vars (gitignored).

name = "chart-akademie-aktien"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# KV-Namespace für den Cache und den Geräte-Sync (Watchlist, DCF-Annahmen).
# Anlegen: npx wrangler kv namespace create AKTIEN_KV --config worker/wrangler.toml
# und die ausgegebene id hier eintragen.
[[kv_namespaces]]
binding = "AKTIEN_KV"
id = "8b16d3abad0445c5af80e88f8d13b91d"

# Cron-Wecker (siehe src/cron.ts): stößt die GitHub Actions per workflow_dispatch an, weil GitHubs
# eigener Scheduler Läufe massenhaft auslässt. Braucht das Secret GITHUB_DISPATCH_TOKEN.
# Die Ausdrücke müssen genau zu AUFTRAEGE in src/cron.ts passen.
[triggers]
crons = [
  "*/15 7-22 * * MON-FRI", # Tracker Mo–Fr alle 15 Minuten
  "0 */2 * * SAT,SUN",   # Tracker Sa/So alle zwei Stunden
  "0 6 * * *",         # Makro täglich
  "*/10 11-22 * * TUE-THU" # Makro Di–Do im Entscheidungsfenster (Frühausstieg in der Action)
]
