# Cloudflare Worker der ChartAkademie: Proxy + Cache (SEC EDGAR + Yahoo Finance), KI-Endpunkte,
# Geräte-Sync und Push-Abos je Nutzer (Einladungscodes), Admin, Cron-Wecker für die GitHub Actions.
# Deploy: npm run worker:deploy  ·  lokal: npm run worker:dev (Port 8787)
# Secrets (nie hier eintragen) → `npx wrangler secret put NAME --config worker/wrangler.toml`:
#   AKTIEN_SECRET (Dienst-Token für Actions und `npm run codes`), SEC_USER_AGENT (Pflicht bei der SEC),
#   ANTHROPIC_API_KEY (KI, optional), GITHUB_DISPATCH_TOKEN (Cron-Wecker, optional)
# Lokal liegen die Secrets in worker/.dev.vars (gitignored); dort ist AKTIEN_SECRET=test das Dienst-Token.

name = "chart-akademie-aktien"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# KV-Namespace für Cache, Einladungscodes (code:<sha256>) und alle Nutzerdaten (<art>:<nutzerId>).
# Anlegen: npx wrangler kv namespace create AKTIEN_KV --config worker/wrangler.toml
# und die ausgegebene id hier eintragen.
[[kv_namespaces]]
binding = "AKTIEN_KV"
id = "8b16d3abad0445c5af80e88f8d13b91d"

# Cron-Wecker (siehe src/cron.ts): stößt die GitHub Actions per workflow_dispatch an, weil GitHubs
# eigener Scheduler Läufe massenhaft auslässt. Braucht das Secret GITHUB_DISPATCH_TOKEN.
# Die Ausdrücke müssen genau zu AUFTRAEGE bzw. TRACKER_CRON in src/cron.ts passen (freier Tarif: höchstens fünf).
[triggers]
crons = [
  "*/15 * * * *",          # Tracker + Preiszonen: was läuft, entscheidet trackerLauf() in src/cron.ts
  "0 6 * * *",         # Makro täglich
  "*/10 11-22 * * TUE-THU", # Makro Di–Do im Entscheidungsfenster (Frühausstieg in der Action)
  "23 * * * *"             # Makro-Board (Kalender & News) stündlich
]
